# Three arms, three workbenches, hand-off chain.
# arm_a picks the red cube from table_a, hands to arm_b, which hands to arm_c.
# Each arm has its own workspace box.

arms:
  - name: arm_a
    mount_pos: [0.0, 0.0, 0.10]
    safety:
      workspace_min: [-0.05, -0.30, 0.10]
      workspace_max: [ 0.30,  0.30, 0.40]

  - name: arm_b
    mount_pos: [0.55, 0.0, 0.10]
    safety:
      workspace_min: [0.40, -0.30, 0.10]
      workspace_max: [0.85,  0.30, 0.40]

  - name: arm_c
    mount_pos: [1.10, 0.0, 0.10]
    safety:
      workspace_min: [0.95, -0.30, 0.10]
      workspace_max: [1.40,  0.30, 0.40]

scene:
  reference_axes: true
  table_grid: true
  tables:
    - size: [0.35, 0.45]
      height: 0.10
      pos: [0.0, 0.0]
    - size: [0.35, 0.45]
      height: 0.10
      pos: [0.55, 0.0]
    - size: [0.35, 0.45]
      height: 0.10
      pos: [1.10, 0.0]
  objects:
    - kind: cube
      size: 0.025
      pos: [0.10, 0.0, 0.13]
      color: red
